{% extends "layout.html" %}
{%load static %}
{% block css_files %}
    <link rel="stylesheet" href="{% static 'challenges/challenges.css' %}">
    <link rel="stylesheet" href="{% static 'challenges/shared/header.css' %}">
    <link rel="stylesheet" href="{% static 'challenges/challenge.css' %}">
{% endblock %}
{% block title %}All Challenges{% endblock %}
{% block content %}
    <h1>All Challenges</h1>
    <ul>
        {% for month, challenge in monthly_challenges.items %}
            <li><a href="{% url 'monthly-challenge' month %}">{{ month|capfirst }}</a></li>
        {% endfor %}
    </ul>
{% endblock %}
